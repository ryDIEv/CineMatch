# nginx каркаса CineMatch: статика заглушки и прокси /api на backend:8000.
# Требования — ui/165 (frontend 8080 наружу, backend только внутри) и
# build.md §5, п. 3 (proxy_buffering off для SSE).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Статика заглушки; сборка React заменит содержимое каталога.
    location / {
        try_files $uri /index.html;
    }

    # API и поток событий: без буферизации, иначе SSE придёт одним куском.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
