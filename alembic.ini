# Alembic для CineMatch — data/120 §9.
# Путь к файлу базы берётся из конфигурации (CINEMATCH_DB_PATH, config.md §1),
# а не из этого файла: sqlalchemy.url подставляется в migrations/env.py и в
# cinematch/data/db.py::init_database().
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url здесь не задаётся: путь к файлу базы берётся из
# CINEMATCH_DB_PATH (config.md §1). Его подставляет migrations/env.py, а для
# временной базы — cinematch/data/db.py::init_database().

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
