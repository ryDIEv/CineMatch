name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверка документации
        run: python scripts/check_docs.py
      - name: Установка uv и зависимостей
        run: |
          pip install uv
          uv sync --frozen
      - name: Тесты
        run: uv run pytest -q
      - name: Стиль
        run: uv run ruff check .
